<main>
  <h1>Hello, {{ title() }}</h1>
  @if (error()) { <p class="error">{{ error() }}</p> }

  <form (ngSubmit)="add()">
    <input name="name" [(ngModel)]="draft.name" placeholder="Name" required />
    <input name="sku" [(ngModel)]="draft.sku" placeholder="SKU" required />
    <input name="quantity" type="number" min="0" [(ngModel)]="draft.quantity" placeholder="Qty" />
    <input name="price" type="number" min="0" step="0.01" [(ngModel)]="draft.price" placeholder="Price" />
    <button type="submit">Add</button>
  </form>

  <table>
    <thead><tr><th>Name</th><th>SKU</th><th>Qty</th><th>Price</th><th></th></tr></thead>
    <tbody>
      @for (i of items(); track i.id) {
        <tr>
          <td>{{ i.name }}</td><td>{{ i.sku }}</td><td>{{ i.quantity }}</td><td>{{ i.price }}</td>
          <td><button type="button" (click)="remove(i.id!)">Delete</button></td>
        </tr>
      } @empty {
        <tr><td colspan="5">No items yet.</td></tr>
      }
    </tbody>
  </table>
</main>
