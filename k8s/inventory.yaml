# Replace <ACCOUNT>/<REGION> with your ECR registry. DB creds come from Secret "inventory-db"
# (see README). Requires the AWS Load Balancer Controller for the Ingress.
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory }
  template:
    metadata:
      labels: { app: inventory }
    spec:
      containers:
        - name: inventory
          image: 330821152525.dkr.ecr.ap-south-1.amazonaws.com/inventory:v1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: inventory-db }   # JDBC_URL, DB_USER, DB_PASSWORD
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 40
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: inventory
spec:
  selector: { app: inventory }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory
  namespace: inventory
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: inventory, port: { number: 80 } }
